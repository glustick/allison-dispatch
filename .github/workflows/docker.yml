name: Docker

# Same shape as the sibling app's workflow: the check job is the gate (lint, typecheck,
# tests), and the multi-arch image build only runs if the gate is green. linux/arm64 is
# built because the deployment target (a Synology NAS) may be ARM-based; QEMU lets the
# amd64 runner build it.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation-only pushes don't trigger a full multi-arch build (~13–20 min with the
    # arm64 better-sqlite3 under QEMU). Any non-.md file still builds; workflow_dispatch
    # stays the manual override.
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest has no ffmpeg on PATH, and the audio-fix tests exercise the relay's
      # real-binary resolution: without this, resolveFfmpegBin() falls back to the bundled
      # ffmpeg-static build, which SIGSEGVs demuxing real TS under Linux (the exact bug
      # class under test). Mirrors the runtime image, which installs Debian's ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
